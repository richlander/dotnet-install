name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Cancel superseded PR runs so repeated pushes to a branch don't each consume a
# full matrix. Pushes to main are never cancelled: release.yml publishes by CI
# run id rather than building fresh, so a main run's artifacts are the release
# and killing one could destroy a set someone meant to publish.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ask GitHub for the PR's own diff. Deriving it locally from
          # base.sha..HEAD compares against the base branch *tip*, so anything
          # that landed on main after the PR opened counts as changed here.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only) || CHANGED=
          else
            BEFORE=${{ github.event.before }}
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=HEAD~1
            fi
            # The clone is shallow, so BEFORE may not be present on a push of
            # several commits.
            CHANGED=$(git diff --name-only "$BEFORE"..."${{ github.sha }}" 2>/dev/null) || CHANGED=
          fi

          code=false
          docs=false
          scripts=false

          # An empty list means the diff failed, not that nothing changed --
          # a real commit always touches something. Run everything rather than
          # skip everything, so a broken diff can never silence CI.
          if [ -z "$CHANGED" ]; then
            echo "could not determine changed files; running all jobs"
            code=true
            docs=true
            scripts=true
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              src/*|test/*|*.props|.github/workflows/*) code=true ;;
            esac
            case "$file" in
              *.md|docs/*) docs=true ;;
            esac
            case "$file" in
              *.sh|*.ps1) scripts=true ;;
            esac
          done <<< "$CHANGED"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "code=$code docs=$docs scripts=$scripts"

  markdownlint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run markdownlint
        run: npx markdownlint-cli2 '**/*.md'

  # The install scripts are how most users first get the tool, and they are the
  # one part of the repo the build cannot exercise.
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # SC3043 flags `local`, which POSIX sh does not define but every shell that
      # runs these (dash, bash, ash, zsh) implements. Same tradeoff rustup makes.
      - name: shellcheck
        run: shellcheck --exclude=SC3043 install.sh install-source.sh install-tool.sh

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$null, [ref]$errs)
          if ($errs) {
            $errs | ForEach-Object {
              Write-Host "::error file=install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
            }
            exit 1
          }
          Write-Host "install.ps1 parses clean"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Test
        run: dotnet test test/dotnet-install.Tests -c Release

  build:
    needs: [changes, markdownlint]
    if: always() && needs.changes.outputs.code == 'true' && needs.markdownlint.result != 'failure'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
            cross: true
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: dotnet-install

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Build
        run: dotnet build dotnet-install/src/dotnet-install -c Release

      - name: Publish NativeAOT
        run: dotnet publish dotnet-install/src/dotnet-install -c Release -r ${{ matrix.rid }} -f net11.0

      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          dotnet-install/artifacts/publish/dotnet-install/release_net11.0_${{ matrix.rid }}/dotnet-install${{ runner.os == 'Windows' && '.exe' || '' }} --version
          dotnet-install/artifacts/publish/dotnet-install/release_net11.0_${{ matrix.rid }}/dotnet-install${{ runner.os == 'Windows' && '.exe' || '' }} --help

      - name: Package binary (tar.gz)
        if: runner.os != 'Windows'
        run: |
          cd dotnet-install/artifacts/publish/dotnet-install/release_net11.0_${{ matrix.rid }}
          tar -czf "$GITHUB_WORKSPACE/dotnet-install-${{ matrix.rid }}.tar.gz" dotnet-install

      - name: Package binary (zip)
        if: runner.os == 'Windows'
        run: |
          cd dotnet-install/artifacts/publish/dotnet-install/release_net11.0_${{ matrix.rid }}
          Compress-Archive -Path dotnet-install.exe -DestinationPath "$env:GITHUB_WORKSPACE/dotnet-install-${{ matrix.rid }}.zip"
        shell: pwsh

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.rid }}
          path: dotnet-install-${{ matrix.rid }}.*

  pack:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: dotnet-install

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pack pointer package
        run: dotnet pack dotnet-install/src/dotnet-install -c Release -p:TargetFrameworks=net10.0 -p:OfficialBuild=true

      - name: Upload pointer package
        uses: actions/upload-artifact@v7
        with:
          name: package-pointer
          path: dotnet-install/artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack any (non-AOT) package
        run: dotnet pack dotnet-install/src/dotnet-install -c Release -r any -p:TargetFrameworks=net10.0 -p:PublishAot=false -p:OfficialBuild=true

      - name: Upload any package
        uses: actions/upload-artifact@v7
        with:
          name: package-any
          path: dotnet-install/artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack linux-x64 AOT package
        run: dotnet pack dotnet-install/src/dotnet-install -c Release -r linux-x64 -p:TargetFrameworks=net11.0 -p:OfficialAotBuild=true

      - name: Upload linux-x64 package
        uses: actions/upload-artifact@v7
        with:
          name: package-linux-x64
          path: dotnet-install/artifacts/package/release/*.nupkg
          if-no-files-found: error

  pack-rid:
    needs: build
    if: always() && needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: dotnet-install

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pack RID-specific package
        run: dotnet pack dotnet-install/src/dotnet-install -c Release -r ${{ matrix.rid }} -p:TargetFrameworks=net11.0 -p:OfficialAotBuild=true

      - name: Upload RID package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: dotnet-install/artifacts/package/release/*.nupkg
          if-no-files-found: error
